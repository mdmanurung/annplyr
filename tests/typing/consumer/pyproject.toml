[project]
name = "annplyr-typing-consumer"
version = "0.0.0"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [ "annplyr" ]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
strict = true
overrides = [ { module = [ "anndata", "anndata.*" ], ignore_missing_imports = true } ]
